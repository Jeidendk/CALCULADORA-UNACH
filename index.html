<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Puntaje Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Ocultar flechas de los inputs number para un look más limpio */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-[#f8fafc] dark:bg-slate-900 transition-colors duration-300">

    <!-- Botón Modo Oscuro -->
    <button id="theme-toggle" type="button" class="fixed top-4 right-4 z-50 p-3 rounded-full bg-white dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all focus:outline-none focus:ring-4 focus:ring-slate-200 dark:focus:ring-slate-700">
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
    </button>

    <div class="w-full max-w-3xl space-y-6">
        
        <!-- Título -->
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-3xl sm:text-4xl font-black text-slate-800 dark:text-white tracking-tight transition-colors">Calculadora de Puntaje</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium transition-colors">Ingresa tus datos para obtener tu nota final sobre 1000</p>
        </div>

        <!-- Tarjeta de Inputs -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200/60 dark:border-slate-700 p-6 sm:p-8 transition-colors">
            <h2 class="text-lg font-bold text-slate-700 dark:text-slate-200 mb-6 flex items-center gap-2 transition-colors">
                <svg class="w-5 h-5 text-indigo-500 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Datos Iniciales
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Input Antecedentes -->
                <div class="space-y-3">
                    <label for="input-antecedentes" class="block text-sm font-semibold text-slate-500 dark:text-slate-400 text-center uppercase tracking-wide transition-colors">
                        Antecedentes académicos <span class="text-slate-400 dark:text-slate-500 normal-case font-normal">(Max. 10)</span>
                    </label>
                    <div class="relative">
                        <input type="number" id="input-antecedentes" 
                            class="block w-full text-center text-4xl sm:text-5xl font-black text-[#12a49b] bg-slate-50 dark:bg-slate-900/50 border-2 border-slate-100 dark:border-slate-700 rounded-2xl py-4 transition-all duration-200 focus:outline-none focus:border-[#12a49b] focus:ring-4 focus:ring-[#12a49b]/10 focus:bg-white dark:focus:bg-slate-900" 
                            value="8.14" step="0.01" min="0" max="10" placeholder="0.00">
                    </div>
                </div>

                <!-- Input Aciertos (Único) -->
                <div class="space-y-3">
                    <label for="input-aciertos" class="block text-sm font-semibold text-slate-500 dark:text-slate-400 text-center uppercase tracking-wide transition-colors">
                        Aciertos de evaluación <span class="text-slate-400 dark:text-slate-500 normal-case font-normal">(Max. 80)</span>
                    </label>
                    <div class="relative">
                        <input type="number" id="input-aciertos" 
                            class="block w-full text-center text-4xl sm:text-5xl font-black text-[#f0ad4e] bg-slate-50 dark:bg-slate-900/50 border-2 border-slate-100 dark:border-slate-700 rounded-2xl py-4 transition-all duration-200 focus:outline-none focus:border-[#f0ad4e] focus:ring-4 focus:ring-[#f0ad4e]/10 focus:bg-white dark:focus:bg-slate-900" 
                            value="70" step="1" min="0" max="80" placeholder="0">
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Resultado Antecedentes (50%) -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border-t-4 border-t-[#12a49b] border border-slate-200/60 dark:border-slate-700 p-6 sm:p-8 relative overflow-hidden group hover:shadow-md transition-all">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-[#12a49b]/5 rounded-full blur-xl group-hover:bg-[#12a49b]/10 transition-colors"></div>
                
                <div class="text-xs font-bold text-[#12a49b] uppercase tracking-wider mb-1">Puntaje (50%) / 500</div>
                <div class="text-sm text-slate-400 dark:text-slate-500 font-medium mb-4 transition-colors">Cálculo: Antecedentes × 50</div>
                
                <div id="resultado-antecedentes" class="text-5xl sm:text-6xl font-black text-slate-800 dark:text-white tracking-tighter transition-colors">
                    407
                </div>
            </div>

            <!-- Resultado Evaluación (50%) -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border-t-4 border-t-[#f0ad4e] border border-slate-200/60 dark:border-slate-700 p-6 sm:p-8 relative overflow-hidden group hover:shadow-md transition-all">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-[#f0ad4e]/5 rounded-full blur-xl group-hover:bg-[#f0ad4e]/10 transition-colors"></div>
                
                <div class="text-xs font-bold text-[#f0ad4e] uppercase tracking-wider mb-1">Puntaje (50%) / 500</div>
                <div class="text-sm text-slate-400 dark:text-slate-500 font-medium mb-4 transition-colors">Cálculo: (Aciertos × 500) ÷ 80</div>
                
                <div id="resultado-evaluacion" class="text-5xl sm:text-6xl font-black text-slate-800 dark:text-white tracking-tighter transition-colors">
                    437.5
                </div>
            </div>

        </div>

        <div class="bg-slate-900 dark:bg-black rounded-3xl shadow-xl p-8 sm:p-10 relative overflow-hidden mt-2 border border-transparent dark:border-slate-800 transition-colors">
            <!-- Elementos decorativos de fondo -->
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
                <div class="absolute -top-[50%] -left-[10%] w-[50%] h-[150%] bg-gradient-to-br from-indigo-500/20 to-transparent rotate-12 transform origin-left"></div>
                <div class="absolute -bottom-[50%] -right-[10%] w-[50%] h-[150%] bg-gradient-to-tl from-emerald-500/20 to-transparent -rotate-12 transform origin-right"></div>
            </div>

            <div class="relative z-10 flex flex-col items-center justify-center text-center">
                <h3 class="text-slate-400 font-semibold text-lg sm:text-xl mb-2 flex items-center gap-2">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                    Nota Final
                </h3>
                <div class="flex items-baseline gap-2">
                    <span id="nota-final" class="text-7xl sm:text-8xl font-black text-white tracking-tighter drop-shadow-md">
                        844.5
                    </span>
                    <span class="text-2xl sm:text-3xl font-bold text-slate-500">/ 1000</span>
                </div>
            </div>
        </div>

    </div>

<script>
    // Lógica para el toggle de modo oscuro
    var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

    // Revisar preferencia de tema guardada o preferencia del sistema
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        themeToggleLightIcon.classList.remove('hidden');
        document.documentElement.classList.add('dark');
    } else {
        themeToggleDarkIcon.classList.remove('hidden');
    }

    var themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', function() {
        // Alternar iconos
        themeToggleDarkIcon.classList.toggle('hidden');
        themeToggleLightIcon.classList.toggle('hidden');

        // Alternar tema y guardarlo
        if (localStorage.getItem('color-theme')) {
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        } else {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        // Referencias a los elementos del DOM
            const inputAntecedentes = document.getElementById('input-antecedentes');
            const inputAciertos = document.getElementById('input-aciertos');
            
            const resultadoAntecedentes = document.getElementById('resultado-antecedentes');
            const resultadoEvaluacion = document.getElementById('resultado-evaluacion');
            const notaFinal = document.getElementById('nota-final');

            // Prevenir ingreso de letras, símbolos o signos negativos desde el teclado
            inputAntecedentes.addEventListener('keydown', function(e) {
                if (['-', '+', 'e', 'E'].includes(e.key)) {
                    e.preventDefault();
                }
            });

            inputAciertos.addEventListener('keydown', function(e) {
                // En aciertos (es sobre 80 preguntas enteras), no se permiten decimales ni símbolos
                if (['-', '+', 'e', 'E', '.', ','].includes(e.key)) {
                    e.preventDefault();
                }
            });

            // Controlar el valor en tiempo real (por si pegan un texto o exceden el límite)
            inputAntecedentes.addEventListener('input', function() {
                let valor = parseFloat(this.value);
                if (valor < 0) this.value = 0;
                // Evitar que pasen de 10 visualmente en el input
                if (valor > 10) this.value = 10; 
                calcularPuntajes();
            });

            inputAciertos.addEventListener('input', function() {
                let valor = parseInt(this.value);
                if (valor < 0) this.value = 0;
                // Evitar que pasen de 80 visualmente en el input
                if (valor > 80) this.value = 80;
                calcularPuntajes();
            });

            // Función principal de cálculo
            function calcularPuntajes() {
                // Obtener valores (o 0 si están vacíos)
                let antecedentes = parseFloat(inputAntecedentes.value) || 0;
                let aciertos = parseInt(inputAciertos.value) || 0;

                // 1. Calcular Puntaje Antecedentes (x 50)
                const calcAntecedentes = antecedentes * 50;
                const displayAntecedentes = Number.isInteger(calcAntecedentes) ? calcAntecedentes : calcAntecedentes.toFixed(2);
                resultadoAntecedentes.textContent = displayAntecedentes;

                // 2. Calcular Puntaje Evaluación ((Aciertos x 500) / 80)
                const calcEvaluacion = (aciertos * 500) / 80;
                const displayEvaluacion = Number.isInteger(calcEvaluacion) ? calcEvaluacion : calcEvaluacion.toFixed(2);
                resultadoEvaluacion.textContent = displayEvaluacion;

                // 3. Calcular Nota Final (Suma de los dos anteriores)
                const totalFinal = calcAntecedentes + calcEvaluacion;
                const displayTotal = Number.isInteger(totalFinal) ? totalFinal : totalFinal.toFixed(2);
                notaFinal.textContent = displayTotal;
            }

            // Ejecutar el cálculo al cargar la página por primera vez
            calcularPuntajes();
        });
    </script>
</body>
</html>
